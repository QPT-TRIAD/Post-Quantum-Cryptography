[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grover-oracle-emulator"
version = "0.1.0"
description = "Small-scale Grover/oracle emulator: real reversible oracle circuits, exact statevector simulation, structural probes, and resource extrapolation."
requires-python = ">=3.12"

# Every version here was resolved and then *verified by execution* — see src/grover_emulator/utils/api_probe.py,
# which is milestone 0 of the build and is re-run by the test suite. Nothing in this project is built on
# an API that has not passed it.
dependencies = [
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "cirq==1.7.0",
    "qsimcirq==0.22.1",
    "quimb==1.15.0",
    "cotengra==0.8.2",
    "sympy==1.14.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "matplotlib==3.11.2",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "typer==0.27.2",
    "numba==0.67.0",
    # Pinned explicitly: qsimcirq 0.22.1 caps contourpy<1.3.3 while matplotlib needs >=1.0.1.
    # 1.3.2 is the single version satisfying both, and the resolver does not always pick it.
    "contourpy==1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.0",
]

[project.scripts]
grover-emulator = "grover_emulator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: runs that take minutes (exhaustive classical simulation at high n)",
    "engine: requires a specific simulation engine",
]
filterwarnings = [
    "ignore::UserWarning:qiskit.*",
]

[tool.coverage.run]
source = ["src/grover_emulator"]
